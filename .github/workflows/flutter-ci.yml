name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=https://young-prot-g-backend-repository-production.up.railway.app/api

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodie-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk